name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-deploy by hand from the Actions tab.
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deployment; newer runs cancel in-flight ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Read the actual Pages URL: project sites use /<repo>, while a
      # custom domain (such as lambdabees.com) serves from the root.
      - name: Read GitHub Pages configuration
        id: pages
        uses: actions/configure-pages@v6

      - name: Build static site
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: Verify export
        run: |
          if [ ! -f out/index.html ]; then
            echo "::error::Build did not produce out/index.html"
            exit 1
          fi
          if [ ! -f out/.nojekyll ]; then
            echo "::error::out/.nojekyll is missing (public/.nojekyll should copy it here)"
            exit 1
          fi
          echo "::notice::Exported $(find out -type f | wc -l) files"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: out
          # upload-pages-artifact v4+ skips dotfiles by default, which would
          # silently drop .nojekyll. GitHub Pages needs it so it stops hiding
          # the _next/ folder.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
